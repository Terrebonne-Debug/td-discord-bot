name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['documentation/**', '*.md']
  pull_request:
    paths-ignore: ['documentation/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basics:
    name: Basic checks
    runs-on: [self-hosted, Linux, X64, discord-bot, primary]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node est configuré une seule fois, via .nvmrc à la racine. La
      # version y est épinglée exactement : même quand Node.js publie un
      # nouveau correctif, setup-node retrouve la distribution dans le cache
      # d'outils du runner auto-hébergé (« Found in cache »), sans aucun
      # téléchargement.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck sources and tests
        run: npm run check

  lint:
    name: Lint and format
    runs-on: [self-hosted, Linux, X64, discord-bot, primary]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vérification seulement : le hook de pré-commit a déjà corrigé. Si le
      # lint échoue quand même (hook contourné, autre machine), le job se
      # corrige tout seul dans le MÊME run : fixes sûrs, nouvelle vérification,
      # puis poussée du commit de correction. Le run ne passe au rouge que si
      # le code est encore cassé après correction (erreur non corrigeable) —
      # aucune fenêtre rouge, aucun run supplémentaire.
      - name: Check lint and formatting
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Apply safe fixes
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run fix

      - name: Re-check after the fixes
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run lint

      - name: Push the fixes
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style : appliquer la mise en forme automatiquement'
          skip_dirty_check: true

  secrets:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, discord-bot]
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Balaye l'historique git à la recherche de secrets (jetons, clés)
      # oubliés. Échoue à la moindre trouvaille ; les faux positifs se
      # déclarent dans un .gitleaks.toml.
      - name: Scan for leaked secrets
        run: |
          docker run --rm -v "$PWD:/scan" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /scan --exit-code 1

  security:
    name: CVE scan
    runs-on: [self-hosted, Linux, X64, discord-bot]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Balaye package-lock.json contre la base OSV (CVE + GHSA). L'étape
      # échoue quand une vulnérabilité connue est trouvée ; pour ignorer un
      # faux positif confirmé, ajouter un osv-scanner.toml au dépôt. Mettre à
      # jour la balise de version aux nouvelles releases d'osv-scanner.
      - name: Scan dependencies for known CVEs
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan --recursive /src

  tests:
    name: Tests and 100% coverage
    runs-on: [self-hosted, Linux, X64, discord-bot, primary]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Réutilise la même version épinglée (.nvmrc) ; sur le runner
      # auto-hébergé, setup-node la retrouve dans son cache d'outils sans
      # téléchargement.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le typecheck ouvre le job : sans la dépendance vers basics, un échec
      # de types échoue ici, avant de mobiliser MongoDB et la suite.
      - name: Typecheck sources and tests
        run: npm run check

      - name: Start an isolated MongoDB
        run: |
          docker rm -f td-discord-bot-ci-mongo >/dev/null 2>&1 || true
          docker run -d --name td-discord-bot-ci-mongo \
            -p 127.0.0.1:27018:27017 mongo:8
          for attempt in $(seq 1 30); do
            if docker exec td-discord-bot-ci-mongo \
              mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become ready" >&2
          docker logs td-discord-bot-ci-mongo || true
          exit 1

      - name: Run unit, functional and end-to-end tests
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27018
        run: npm run test:coverage

      # Le point d'entrée doit démarrer et échouer proprement sur un jeton
      # invalide : un garde-fou contre les régressions du démarrage.
      - name: Smoke test the startup path
        run: |
          set +e
          output=$(DISCORD_TOKEN=invalide DEEPSEEK_API_KEY=invalide \
            LOG_FILE_ENABLED=false node src/index.ts 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ] || ! echo "$output" | grep -q 'Échec du démarrage du bot'; then
            echo 'Le démarrage aurait dû échouer proprement (code 1).' >&2
            exit 1
          fi

      - name: Stop the test MongoDB
        if: always()
        run: docker rm -f td-discord-bot-ci-mongo >/dev/null 2>&1 || true
