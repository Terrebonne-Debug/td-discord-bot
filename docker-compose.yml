services:
  mongo:
    image: mongo:8
    container_name: td-discord-bot-mongo
    restart: unless-stopped
    ports:
      # Bound to localhost only: the database is not exposed to the network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
